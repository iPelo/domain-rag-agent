# Local vector database. Data persists across container restarts.
services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: germanlawrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
